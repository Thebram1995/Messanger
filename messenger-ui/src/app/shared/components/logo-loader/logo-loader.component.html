<section
  class="loader-screen"
  [class.loader-screen--fullscreen]="fullscreen"
  role="status"
  aria-live="polite"
  [attr.aria-label]="message + ' ' + progress + '%'"
>
  <div class="loader-card">
    <div
      class="logo-loader"
      [style.--progress.%]="progress"
      aria-hidden="true"
    >
      <div class="logo-loader__outline"></div>
      <div class="logo-loader__fill"></div>
      <div class="logo-loader__shine"></div>
    </div>

    <div class="loader-info">
      <p class="loader-info__message">{{ message }}</p>

      <strong
        *ngIf="showPercentage"
        class="loader-info__percentage"
      >
        {{ progress | number:'1.0-0' }}%
      </strong>

      <div
        class="progress-track"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        [attr.aria-valuenow]="progress"
      >
        <div
          class="progress-track__fill"
          [style.width.%]="progress"
        ></div>
      </div>
    </div>
  </div>
</section>
