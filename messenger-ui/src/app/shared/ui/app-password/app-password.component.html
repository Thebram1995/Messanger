<label class="app-password">

  @if (label) {
    <span class="app-password__label">
      {{ label }}
    </span>
  }

  <div
    class="app-password__wrapper"
    [class.app-password__wrapper--error]="hasError">

    <input
      class="app-password__field"
      [attr.aria-invalid]="hasError"
      [type]="showPassword ? 'text' : 'password'"
      [placeholder]="placeholder"
      [autocomplete]="autocomplete"
      [value]="value"
      [disabled]="disabled"
      (input)="handleInput($event)"
      (blur)="handleBlur()"
    />

    <button
      class="app-password__toggle"
      type="button"
      [disabled]="disabled"
      [attr.aria-label]="
        showPassword
          ? 'Ocultar contraseña'
          : 'Mostrar contraseña'
      "
      (click)="togglePasswordVisibility()">

      @if (showPassword) {
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true">
          <path
            d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8M9.9 4.2A10.8 10.8 0 0112 4c5.5 0 9 5.5 9 5.5a16 16 0 01-2.1 2.7M6.2 6.2C4.2 7.6 3 9.5 3 9.5S6.5 15 12 15a9 9 0 003.1-.6"
          />
        </svg>
      } @else {
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true">
          <path
            d="M3 12s3.5-5.5 9-5.5S21 12 21 12s-3.5 5.5-9 5.5S3 12 3 12z"
          />
          <circle cx="12" cy="12" r="2.5" />
        </svg>
      }

    </button>

  </div>

</label>
